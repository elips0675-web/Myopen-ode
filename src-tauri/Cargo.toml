[package]
name = "myopencode"
version = "0.1.0"
description = "My OpenCode desktop wrapper (Tauri/WebView2)"
authors = ["My OpenCode"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
