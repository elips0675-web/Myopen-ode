<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чат с Ollama</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#f5f5f5;color:#1a1a1a;height:100vh;display:flex;flex-direction:column}
@media(prefers-color-scheme:dark){body{background:#1a1a1a;color:#e0e0e0}}
h1{text-align:center;padding:12px;font-size:16px;font-weight:600;border-bottom:1px solid #e0e0e0;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0}
@media(prefers-color-scheme:dark){h1{background:#252525;border-color:#333}}
h1 select{font-size:12px;padding:3px 8px;border:1px solid #ddd;border-radius:6px;background:#fff;outline:none}
@media(prefers-color-scheme:dark){h1 select{background:#333;color:#e0e0e0;border-color:#555}}
#messages{flex:1;overflow-y:auto;padding:12px;scroll-behavior:smooth}
.msg{margin-bottom:10px;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5;max-width:85%;word-wrap:break-word}
.msg.user{background:#e8f0fe;margin-left:auto;border-bottom-right-radius:4px}
.msg.assistant{background:#fff;margin-right:auto;border-bottom-left-radius:4px;border:1px solid #e8e8e8}
@media(prefers-color-scheme:dark){.msg.user{background:#1e3a5f}.msg.assistant{background:#2a2a2a;border-color:#333}}
.msg.system{text-align:center;font-size:12px;color:#888;background:none;margin:8px auto;padding:4px}
.msg .h{font-size:11px;color:#888;margin-bottom:4px;font-weight:500}
.msg pre{background:#f8f9fa;padding:10px;border-radius:6px;overflow-x:auto;font-size:13px;margin:8px 0;border:1px solid #e8e8e8}
.msg code{background:#f0f0f0;padding:1px 4px;border-radius:3px;font-size:13px}
.msg pre code{background:none;padding:0;border:none}
@media(prefers-color-scheme:dark){.msg pre{background:#1e1e1e;border-color:#333}.msg code{background:#333}}
.loading{color:#888;font-style:italic;font-size:13px}
.sp{display:inline-block;width:14px;height:14px;border:2px solid #ddd;border-top-color:#2563eb;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
#input-area{display:flex;padding:10px 14px;border-top:1px solid #e0e0e0;background:#fff;gap:8px;flex-shrink:0}
@media(prefers-color-scheme:dark){#input-area{background:#252525;border-color:#333}}
#input{flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:10px;font-size:14px;outline:none;resize:none;min-height:42px;max-height:120px;font-family:inherit}
#input:focus{border-color:#2563eb}
@media(prefers-color-scheme:dark){#input{background:#333;color:#e0e0e0;border-color:#555}#input:focus{border-color:#3b82f6}}
#send{background:#2563eb;color:#fff;border:none;border-radius:10px;padding:8px 20px;font-size:14px;cursor:pointer;font-weight:500;align-self:flex-end}
#send:hover{background:#1d4ed8}
#send:disabled{opacity:.4;cursor:default}
@media(prefers-color-scheme:dark){#send{background:#3b82f6}#send:hover{background:#60a5fa}}
</style>
</head>
<body>
<h1>
🤖 Чат с Ollama
<select id="model"></select>
</h1>
<div id="messages">
<div class="msg system">Напиши сообщение — я отвечу</div>
</div>
<div id="input-area">
<textarea id="input" placeholder="Напиши что-нибудь..." rows="1"></textarea>
<button id="send">→</button>
</div>
<script>
const OLLAMA_URL = 'http://localhost:11434';
let messages = [{role:'system',content:'Ты — полезный ассистент. Отвечай кратко и по делу.'}];
let streaming = false;
let abortCtrl = null;

async function loadModels() {
  try {
    const r = await fetch(OLLAMA_URL + '/api/tags');
    const d = await r.json();
    const sel = document.getElementById('model');
    sel.innerHTML = d.models.map(m => `<option value="${m.name}">${m.name.replace(':latest','')}</option>`).join('');
  } catch(e) {
    addMsg('system','⚠️ Ollama не запущена. Запусти: ollama serve');
  }
}

function addMsg(role, html) {
  const c = document.getElementById('messages');
  const m = document.createElement('div');
  m.className = 'msg ' + role;
  if (role !== 'system') {
    const h = document.createElement('div');
    h.className = 'h';
    h.textContent = role === 'user' ? 'Вы' : 'AI';
    m.appendChild(h);
  }
  const f = document.createElement('div');
  f.innerHTML = html;
  m.appendChild(f);
  c.appendChild(m);
  c.scrollTop = c.scrollHeight;
  return m;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmt(t) {
  let h = esc(t);
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  return h.replace(/\n/g,'<br>');
}

async function send() {
  const inp = document.getElementById('input');
  const text = inp.value.trim();
  if (!text || streaming) return;
  inp.value = '';
  addMsg('user', fmt(text));
  messages.push({role:'user', content:text});
  const model = document.getElementById('model').value;
  const me = addMsg('assistant', '<span class="sp"></span>');
  streaming = true;
  document.getElementById('send').disabled = true;
  abortCtrl = new AbortController();
  try {
    const r = await fetch(OLLAMA_URL + '/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model: model || 'qwen2.5-coder:7b',
        messages: messages,
        stream: true,
        options: {temperature: 0.2, num_predict: 4096}
      }),
      signal: abortCtrl.signal
    });
    const rd = r.body.getReader();
    const dc = new TextDecoder();
    let full = '';
    let buf = '';
    while (true) {
      const {done, value} = await rd.read();
      if (done) break;
      buf += dc.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const l of lines) {
        if (l) {
          try {
            const j = JSON.parse(l);
            const c = j.message?.content || '';
            if (c) full += c;
          } catch(e) {}
        }
      }
      me.innerHTML = fmt(full) || '<span class="sp"></span>';
      me.scrollIntoView({behavior:'smooth', block:'end'});
    }
    messages.push({role:'assistant', content: full});
    me.innerHTML = fmt(full);
  } catch(e) {
    if (e.name !== 'AbortError') me.innerHTML = '⚠️ Ошибка: ' + e.message;
  }
  streaming = false;
  document.getElementById('send').disabled = false;
}

document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('send').onclick = send;
loadModels();
</script>
</body>
</html>
