name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi uvicorn requests duckduckgo_search
      - run: python -c "import ast; ast.parse(open('agent.py', encoding='utf-8').read()); print('Syntax OK')"
      - run: python test_agent.py
